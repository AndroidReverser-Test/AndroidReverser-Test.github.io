<style>
  .post-content .mermaid {
    margin: 1.5em 0;
    overflow-x: auto;
    text-align: center;
  }
</style>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.esm.min.mjs';

  const diagrams = [];
  document.querySelectorAll('.post-content pre > code.language-mermaid, .post-content .language-mermaid pre > code').forEach((code) => {
    const diagram = document.createElement('div');
    diagram.className = 'mermaid';
    diagram.textContent = code.textContent;
    const block = code.closest('.highlighter-rouge') || code.parentElement;
    block.replaceWith(diagram);
    diagrams.push(diagram);
  });

  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default' });
  await mermaid.run({ nodes: diagrams });
</script>
